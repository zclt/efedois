services:
  api:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DEFAULT_FIIS: "${DEFAULT_FIIS:-MXRF11}"
      NTFY_TOPIC: "${NTFY_TOPIC:-}"
      NTFY_SERVER: "${NTFY_SERVER:-https://ntfy.sh}"
      NTFY_TOKEN: "${NTFY_TOKEN:-}"
      NTFY_INTERVAL_SEC: "${NTFY_INTERVAL_SEC:-300}"
      NTFY_PRICE_THRESHOLD: "${NTFY_PRICE_THRESHOLD:-2}"
    volumes:
      - monitor-data:/app/data
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/fii/MXRF11"]
    #   interval: 60s
    #   timeout: 30s
    #   retries: 3
    #   start_period: 10s

volumes:
  monitor-data:
